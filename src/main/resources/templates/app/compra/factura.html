<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ProjectShop</title>

	<link rel="stylesheet"
	      th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
	<link rel="stylesheet"
	      th:href="@{/css/styles.css}">
</head>

<body>

<header th:replace="layouts/title::title"> </header>

<nav th:replace="layouts/navbar::navbar"></nav>

<form th:action="@{/auth/logout}"
      method="POST"
      id="logoutForm">
</form>

<main>
	<div class="container my-4">

		<div class="row">
			<div class="col-md-6 offset-md-3">

				<div class="d-flex justify-content-between align-items-center">
					<h2>Factura</h2>
					<h3 class="mb-0">
						Compra #<span th:text="${compra.id}">1234</span>
					</h3>
				</div>

				<hr>

				<div class="row">
					<div class="col-6">
						<address>
							<strong>Comprado por:</strong><br>
							<span th:text="${compra.propietary.name + ' ' + compra.propietary.surName}"></span><br>
							<span th:text="${compra.propietary.email}">Fulano</span><br>
						</address>
					</div>

					<div class="col-6 text-end">
						<address>
							<strong>Fecha de compra:</strong><br>
							<span th:text="${#temporals.format(compra.buyDate,'dd/MMM/yyyy HH:mm')}">
                                10/10/2018 10:10
                            </span><br>
							<br>
						</address>
					</div>
				</div>

			</div>
		</div>

		<div class="row">
			<div class="col-md-6 offset-md-3">

				<div class="card invoice-card">
					<div class="card-header">
						<h3 class="card-title mb-0">
							<strong>Listado de productos</strong>
						</h3>
					</div>

					<div class="card-body">
						<div class="table-responsive">

							<table class="table table-sm mb-0 w-100">
								<thead>
								<tr>
									<th>Producto</th>
									<th class="text-end">Cantidad</th>
									<th class="text-end">Precio</th>
								</tr>
								</thead>

								<tbody>
								<tr th:each="producto : ${productos}">
									<td th:text="${producto.name}">
										Producto
									</td>

									<td class="text-end"
									    th:text="${producto.buyQuantity}">
										1
									</td>

									<td class="text-end"
									    th:text="${#numbers.formatCurrency(producto.price * producto.buyQuantity)}">
										123€
									</td>
								</tr>

								<tr>
									<td colspan="2" class="text-end">
										<strong>Total</strong>
									</td>

									<td class="text-end">
										<strong th:text="${#numbers.formatCurrency(total_compra)}">
											123€
										</strong>
									</td>
								</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="row mt-4">
		<div class="col-md-6 offset-md-3">

			<hr>

			<div class="d-flex justify-content-between align-items-center">
				<h5 class="mb-0">Estado del pedido</h5>

				<span class="badge bg-info text-dark"
				      th:text="${compra.buyState}">
                		STATE
            			</span>
			</div>
		</div>
	</div>

</main>

<footer th:replace="layouts/footer::footer"></footer>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
