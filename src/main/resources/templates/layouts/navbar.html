<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ProjectShop</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark" data-bs-theme="dark" th:fragment="navbar">
    <form th:action="@{/auth/logout}" method="POST" id="logoutForm">
        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <!-- -->
    </form>
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/public/news}">Novedades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/public/aboutus}">Sobre nosotros</a>
                </li>

                <li class="nav-item dropdown " sec:authorize="hasAnyRole('ADMIN', 'OWNER')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Admin menu
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/admin/adminProducts}">Productos</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/adminBuys}">Pedidos</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/adminUsers}">Usuarios</a></li>
                    </ul>
                </li>
            </ul>

            <div class="navbar-nav me-5" th:if="${filter}">
                <form action="" class="input-group filter" data-bs-theme="light">
                    <a sec:authorize="hasAnyRole('ADMIN', 'OWNER')" th:if="${addProduct}" th:href="@{/admin/product/new}" class="btn btn-light" type="button" id="button-addon1">
                        +
                    </a>
                    <input type="text" class="form-control" placeholder="Buscar..." aria-label="Buscar..." aria-describedby="button-addon2" name="q">
                    <button class="btn btn-light" type="submit" id="button-addon2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                        </svg>
                    </button>
                </form>
            </div>

            <ul class="navbar-nav me-5">

                <a th:href="@{/app/carrito}" class="nav-link">
                    <i class="bi bi-cart"></i>
                    Carrito
                    <span class="badge bg-primary"
                          th:if="${not #lists.isEmpty(carrito)}"
                          th:text="${#lists.size(carrito)}"></span>
                </a>

                <li class="active" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/auth/login}">
                        Login
                    </a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" th:text="${#authentication.name}" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Account
                    </a>
                    <ul sec:authorize="isAuthenticated()" class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/app/miscompras}">Mis compras</a></li>
                        <li><a class="dropdown-item" href="#">Configuración</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item"href="javascript:document.getElementById('logoutForm').submit()">
                                Salir
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>

    </div>
</nav>

</body>
</html>
