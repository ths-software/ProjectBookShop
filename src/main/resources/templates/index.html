<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>ProjectShop</title>

	<link rel="stylesheet"
	      th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

	<link rel="stylesheet"
	      th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="layouts/title::title"> </header>

<nav th:replace="layouts/navbar::navbar"></nav>

<main>



	<div class="card-container" >
		<div th:each="producto : ${productos}">

			<a class="card" th:href="@{/public/producto/{id}(id=${producto.id})}">
				<div class="product-image-container">
					<img src="http://placehold.it/350x260"
					     class="product-image" alt="..."
					     th:src="${#strings.isEmpty(producto.Image)} ? 'http://placehold.it/350x260' : ${producto.Image}">

				</div>
				<div class="card-body">
					<h5 class="card-title" th:text="${producto.name}">Card title</h5>
					<p class="card-text" th:text="${#numbers.formatCurrency(producto.price)}"></p>
				</div>
			</a>

		</div>
	</div>

	<!-- Paginador -->
	<nav th:if="${#strings.isEmpty(param.q)}" aria-label="Paginación">
		<ul class="pagination justify-content-center">
			<!-- Página anterior -->
			<li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
				<a class="page-link"
				   th:if="${currentPage > 1}"
				   th:href="@{/public/(page=${currentPage - 1})}"
				   aria-label="Anterior">
					&laquo;
				</a>
				<span class="page-link" th:if="${currentPage <= 1}">
                &laquo;
            </span>
			</li>
			<!-- Páginas -->
			<li class="page-item"
			    th:each="p : ${pages}"
			    th:classappend="${p == currentPage} ? 'active'">

				<a class="page-link"
				   th:href="@{/public/(page=${p})}"
				   th:text="${p}">
				</a>
			</li>
			<!-- ... y última página -->
			<li class="page-item disabled" th:if="${hasNextBlock}">
				<span class="page-link">...</span>
			</li>
			<li class="page-item"
			    th:if="${hasNextBlock}"
			    th:classappend="${lastPage == currentPage} ? 'active'">
				<a class="page-link"
				   th:href="@{/public/(page=${lastPage})}"
				   th:text="${lastPage}">
				</a>
			</li>
			<!-- Página siguiente -->
			<li class="page-item"
			    th:classappend="${currentPage >= totalPages} ? 'disabled'">
				<a class="page-link"
				   th:if="${currentPage < totalPages}"
				   th:href="@{/public/(page=${currentPage + 1})}"
				   aria-label="Siguiente">
					&raquo;
				</a>
				<span class="page-link" th:if="${currentPage >= totalPages}">
                &raquo;
            </span>
			</li>
		</ul>
	</nav>

</main>

<footer th:replace="layouts/footer::footer"></footer>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
