<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>
<body>

<header th:replace="layouts/title::title"> </header>


<nav th:replace="layouts/navbar::navbar"></nav>


<main class="container-fluid d-flex justify-content-center align-items-center">

    <div class="w-100" style="max-width: 450px;">

        <h1 class="text-center mb-4">
            Crear una cuenta
        </h1>

        <form method="post"
              enctype="multipart/form-data"
              th:action="@{/auth/register}"
              th:object="${user}">


            <div class="mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input type="email"
                       id="email"
                       class="form-control"
                       th:field="*{email}"
                       placeholder="tu@email.com"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">

                <div th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"
                     class="invalid-feedback">
                    Error
                </div>

            </div>


            <div class="mb-3">

                <label for="nombre" class="form-label">
                    Nombre
                </label>

                <input type="text"
                       id="nombre"
                       class="form-control"
                       th:field="*{name}"
                       placeholder="Nombre"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">

                <div th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}"
                     class="invalid-feedback">
                    Error
                </div>

            </div>


            <div class="mb-3">

                <label for="apellidos" class="form-label">
                    Apellidos
                </label>

                <input type="text"
                       id="apellidos"
                       class="form-control"
                       th:field="*{surName}"
                       placeholder="Apellidos"
                       th:classappend="${#fields.hasErrors('surName')} ? 'is-invalid'">

                <div th:if="${#fields.hasErrors('surName')}"
                     th:errors="*{surName}"
                     class="invalid-feedback">
                    Error
                </div>

            </div>


            <div class="mb-4">

                <label for="password" class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       id="password"
                       class="form-control"
                       th:field="*{password}"
                       placeholder="Contraseña"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">

                <div th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"
                     class="invalid-feedback">
                    Error
                </div>

            </div>

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <!-- -->

            <div class="d-flex gap-2">

                <button id="btn-signup"
                        type="submit"
                        class="btn btn-primary flex-grow-1">
                    Crear cuenta
                </button>

                <a th:href="@{/auth/login}"
                   class="btn btn-outline-secondary">
                    Volver
                </a>

            </div>

        </form>

    </div>

</main>

<footer th:replace="layouts/footer::footer"></footer>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
