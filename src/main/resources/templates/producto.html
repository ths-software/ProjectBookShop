<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ProjectShop</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="layouts/title::title"> </header>

<nav th:replace="layouts/navbar::navbar"></nav>

<main>

    <div class="container mt-5">

        <div class="row">

            <!-- Imagen -->
            <div class="col-md-6">
                <img    src="https://placeholdit.com/1600x600/dddddd/999999"
                        th:src="${#strings.isEmpty(producto.image)} ? 'https://placeholdit.com/1600x600/dddddd/999999' : ${producto.image}"
                     class="img-fluid"
                     alt="Producto">
            </div>

            <!-- Información -->
            <div class="col-md-6 border">

                <h3 th:text="${producto.name}"></h3>

                <div th:if="${productStock.stockQuantity <= 0}" class="alert alert-danger"> Sin stock por el momento</div>

                <form action="" method="post">

                    <!-- CSRF -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <!-- -->

                    <span> Cantidad </span>
                    <select name="quantity" class="form-select form-select-sm mb-3">

                        <option th:if="${productStock.stockQuantity >= 1}" value="1">1</option>
                        <option th:if="${productStock.stockQuantity >= 2}" value="2">2</option>
                        <option th:if="${productStock.stockQuantity >= 3}" value="3">3</option>
                        <option th:if="${productStock.stockQuantity >= 4}" value="4">4</option>
                        <option th:if="${productStock.stockQuantity >= 5}" value="5">5</option>
                        <option th:if="${productStock.stockQuantity >= 6}" value="6">6</option>
                        <option th:if="${productStock.stockQuantity >= 7}" value="7">7</option>
                        <option th:if="${productStock.stockQuantity >= 8}" value="8">8</option>
                        <option th:if="${productStock.stockQuantity >= 9}" value="9">9</option>
                        <option th:if="${productStock.stockQuantity >= 10}" value="10">10</option>

                    </select>

                    <div>
                        <h4>
                            <strong th:text="${#numbers.formatCurrency(producto.price)}"></strong>
                        </h4>
                    </div>

                    <hr class="hr">

                    <div>
                        <h3>Descripción</h3>
                        <p th:text="${producto.description}">
                        </p>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" sec:authorize="isAuthenticated()"
                                th:formaction="@{/app/carrito/add/{id}(id=${producto.id})}"
                                th:if="${productStock.stockQuantity > 0}">
                            <span class="glyphicon glyphicon-shopping-cart"></span> Añadir a carrito
                        </button>

                        <button class="btn btn-success" sec:authorize="isAuthenticated()"
                                th:formaction="@{/app/comprar/add/{id}(id=${producto.id})}"
                                th:if="${productStock.stockQuantity > 0}">
                            <span class="glyphicon glyphicon-shopping-cart"></span> Comprar
                        </button>
                    </div>
                </form>

            </div>

        </div>

    </div>

</main>

<footer th:replace="layouts/footer::footer"></footer>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
