<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProjectShop</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>

<body>

<header th:replace="layouts/title::title"> </header>

<nav th:replace="layouts/navbar::navbar"></nav>

<form th:action="@{/auth/logout}"
      method="POST"
      id="logoutForm">
</form>

<main class="container my-4">

    <form method="post"
          enctype="multipart/form-data"
          th:action="@{/admin/product/edit/submit}"
          th:object="${product}">

        <h1 class="mb-4">Editar producto</h1>

        <div class="mb-3">
            <input type="hidden"
                   class="form-control"
                   id="id"
                   placeholder="0"
                   th:value="*{id}"
                   th:field="*{id}"
                   name="id"
                   th:attrappend="readonly=true">
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text"
                   class="form-control"
                   id="name"
                   placeholder="Nombre"
                   th:value="*{name}"
                   th:field="*{name}"
                   name="name">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <input type="text"
                   class="form-control"
                   id="description"
                   placeholder="Descripción"
                   th:value="*{description}"
                   th:field="*{description}"
                   name="description">
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Precio</label>
            <input type="text"
                   class="form-control"
                   id="price"
                   placeholder="0"
                   th:value="*{price}"
                   th:field="*{price}"
                   name="price">
        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="text"
                   class="form-control"
                   id="stock"
                   placeholder="0"
                   th:value="${stock.stockQuantity}"
                   name="stock">
        </div>

        <div class="mb-3">
            <label for="file" class="form-label">Imagen</label>
            <input id="file"
                   name="file"
                   class="form-control"
                   type="file">
        </div>

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <!-- -->

        <button type="submit" class="btn btn-primary">
            Enviar
        </button>

    </form>

</main>

<footer th:replace="layouts/footer::footer"></footer>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
